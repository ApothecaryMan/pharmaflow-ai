  <script type="importmap">

  <script>
    // Force hide icon ligatures until font is actually ready to render
    if ('fonts' in document) {
      document.fonts.load('24px "Material Symbols Rounded"').then(() => {
        document.documentElement.classList.add('fonts-loaded');
      }).catch(() => {
        // Fallback if loading fails, show text after 3s anyway
        setTimeout(() => document.documentElement.classList.add('fonts-loaded'), 3000);
      });
    } else {
      // Fallback for older browsers
      document.documentElement.classList.add('fonts-loaded');
    }
  </script>
</head>

<body class="bg-[var(--bg-page-surface)] text-[var(--text-primary)] overflow-hidden">
  <div id="root"></div>
  <div id="boot-splash">
    <style>
      :root {
        --boot-bg: #fafafa;
        --boot-brand: #18181b;
        --boot-dot: #d4d4d8;
      }

      html.dark {
        --boot-bg: #000000;
        --boot-brand: #fafafa;
        --boot-dot: #27272a;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg);
        z-index: 9999;
        transition: opacity 0.25s ease-out;
      }

      #boot-splash[aria-hidden='true'] {
        opacity: 0;
        pointer-events: none;
      }

      .boot-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-variation-settings: normal;
        font-optical-sizing: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .boot-brand {
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--boot-brand);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-variation-settings: normal;
        font-optical-sizing: none;
      }

      .boot-brand-logo {
        height: 1.75rem;
        width: auto;
        color: var(--boot-brand);
      }

      .boot-progress {
        width: 140px;
        height: 3px;
        background: var(--boot-dot);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        opacity: 0.6;
        margin-top: 4px;
      }

      .boot-progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        background: var(--boot-brand);
        border-radius: 4px;
        animation: boot-fill 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        transform-origin: left;
      }

      @keyframes boot-fill {
        0% { transform: scaleX(0); opacity: 1; }
        80% { transform: scaleX(1); opacity: 1; }
        99% { transform: scaleX(1); opacity: 0; }
        100% { transform: scaleX(0); opacity: 0; }
      }

      @keyframes boot-bounce {

        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-6px);
        }
      }
    </style>
    <div class="boot-content" aria-label="Loading">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" class="boot-brand-logo">
        <g fill="var(--boot-brand)">
          <path d="M 40,75 L 210,75 L 210,110 L 85,225 L 210,225 L 210,260 L 40,260 L 40,225 L 165,110 L 40,110 Z" />
          <rect x="290" y="75" width="35" height="185" />
          <path d="M 420,75 L 560,75 L 560,260 L 525,260 L 525,110 L 455,110 L 455,260 L 420,260 Z" />
          <path d="M 670,75 L 840,75 L 840,110 L 705,110 L 705,225 L 840,225 L 840,260 L 670,260 Z" />
        </g>
      </svg>
      <div class="boot-progress" aria-hidden="true">
        <div class="boot-progress-bar"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>

  <!-- Service Worker Registration -->
  <script>
    if ("serviceWorker" in navigator && !window.__TAURI_INTERNALS__) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/sw.js")
          .then((_registration) => {
            // console.log("✅ Service Worker registered:", registration.scope);
          })
          .catch((error) => {
            console.log("❌ Service Worker registration failed:", error);
          });
      });
    }
  </script>
</body>

</html>
